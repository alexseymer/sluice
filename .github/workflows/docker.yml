name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - src/**
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - src/**
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sluice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
