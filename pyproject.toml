[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sluice"
version = "0.1.0"
description = "AI work orchestrator — pace CLI usage across the day"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.22.1",
    "croniter>=6.2.4",
    "httpx>=0.28.1",
    "matrix-nio>=0.25",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
]

[project.scripts]
sluice = "sluice.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sluice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sluice"]
mypy_path = "src"
